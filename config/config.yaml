# CodeXray configuration.
# Purpose: single source of tunable behaviour for indexing, retrieval, the LLM and
# security. Nothing important is hard-coded in the application; see
# backend/app/config/settings.py for the typed loader. Values may reference
# environment variables as ${VAR} and are overridden by CODEXRAY_* env vars.

project:
  # Default project root used by scripts/index_project.py when --root is omitted.
  root: ./projects/synthetic-test-project

scan:
  # File extensions the scanner treats as source. Everything else becomes a plain
  # "document" (indexed for text/RAG only) or is ignored.
  java_extensions: [".java"]
  sql_extensions: [".sql"]
  config_extensions: [".properties", ".yaml", ".yml", ".xml", ".json"]
  doc_extensions: [".md", ".txt", ".rst", ".adoc"]
  # Directory names skipped entirely.
  ignore_dirs:
    - .git
    - .idea
    - .venv
    - venv
    - node_modules
    - target
    - build
    - out
    - dist
    - __pycache__
  max_file_bytes: 2000000   # skip files larger than this (generated / vendored)

index:
  database: ${CODEXRAY_INDEX_DB:-data/indexes/codexray.db}
  vector_store: ./data/vectors
  incremental: true          # skip files whose content hash is unchanged

llm:                         # Sprint 3 — local inference
  provider: ${CODEXRAY_LLM_PROVIDER:-ollama}   # ollama | echo (echo = offline stub)
  model: ${CODEXRAY_LLM_MODEL:-qwen2.5-coder:7b}
  host: ${CODEXRAY_LLM_HOST:-http://localhost:11434}
  temperature: 0.1
  context_length: 8192         # num_ctx passed to the model. On CPU/24 GB keep this
                               # modest — the KV cache for 32k context can exhaust RAM
                               # and make Ollama return HTTP 500. Raise only if needed.
  max_tokens: 2048             # cap on generated tokens per answer (line-by-line requests
                               # auto-raise this to 4096)
  request_timeout_s: 300       # CPU inference (esp. first cold load) can be slow
  context_char_budget: 16000   # max chars of assembled evidence in the prompt

embedding:                   # Sprint 4 — semantic retrieval
  provider: ${CODEXRAY_EMBEDDING_PROVIDER:-ollama}   # ollama | hashing (offline, no model)
  model: ${CODEXRAY_EMBEDDING_MODEL:-nomic-embed-text}
  host: ${CODEXRAY_EMBEDDING_HOST:-http://localhost:11434}
  dim: 512                    # vector size for the hashing fallback
  batch: 16

graph:                       # Sprint 4 — dependency graph
  enabled: true
  max_impact_depth: 4        # BFS depth for impact_analysis()

flow:                        # "trace this flow end to end" walkthroughs
  max_depth: 4               # how deep to recurse through nested method calls
  max_methods: 25            # hard cap on methods in one trace (protects context)
  full_source_methods: 6     # first N methods get full source in the prompt; rest get a summary

agent:                       # Sprint 5 — tool-calling investigation agent
  max_iterations: 8          # extra LLM-requested tool rounds after the deterministic seed plan
  enable_llm_planning: true  # false => run only the seed plan (fast, fully deterministic)
  tool_result_char_limit: 8000

dynamic_sql:                  # Sprint 2 — dynamic SQL reconstruction
  enabled: true
  max_depth: 5               # max nested method-return inlining depth

retrieval:
  # Weights for the multi-signal code ranking described in §36 of the build plan.
  weights:
    symbol_exact: 5.0
    path_match: 2.0
    keyword: 1.5
    semantic: 3.0
    dependency: 1.0
    sql: 1.5
  semantic_top_k: 8          # chunks pulled from the vector store per query
  hybrid_top_k: 12           # final blended results returned

security:
  local_only: ${CODEXRAY_LOCAL_ONLY:-true}
  redact_secrets: ${CODEXRAY_REDACT_SECRETS:-true}
  # Regex fragments whose matched values are masked in any indexed config/text.
  secret_key_patterns: ["password", "passwd", "secret", "token", "api[_-]?key", "connection[_-]?string", "credential"]

logging:
  level: INFO
